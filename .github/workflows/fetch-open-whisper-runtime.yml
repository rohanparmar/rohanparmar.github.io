name: Fetch open Vosk Hindi and Indian-English runtime

on:
  push:
    branches:
      - chatgpt-model-download-links-20260812
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build portable Vosk runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/site-packages bundle/models
          python -m pip install --upgrade pip
          python -m pip install --target bundle/site-packages vosk==0.3.45
          python - <<'PY'
          import sys
          sys.path.insert(0, 'bundle/site-packages')
          import vosk
          print('Vosk import OK:', vosk.__file__)
          PY

      - name: Download open Hindi and Indian-English models
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            -o /tmp/vosk-hi.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          curl -L --fail --retry 5 --retry-delay 3 \
            -o /tmp/vosk-en-in.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q /tmp/vosk-hi.zip -d bundle/models
          unzip -q /tmp/vosk-en-in.zip -d bundle/models
          find bundle -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | head -100

      - name: Upload Vosk runtime and models
        uses: actions/upload-artifact@v4
        with:
          name: vosk-hindi-indian-english-runtime
          path: bundle
          compression-level: 0
          retention-days: 1
